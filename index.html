<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifiche on site Cantiere - Interne e Subappalto – Delta Impianti</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--n:#9fb0ff;--o:#ef8a2a;--bg:#050607;--card:#14161c;--b:#2c3140;--tx:#e7e9f1;--mu:#9aa2bd;--th:#1d2130;--inp:#0c0e13;--ok:#22b866;--ko:#f0524a;--w:#e0ad00}
header img,#login img{background:#fff;padding:3px 8px;border-radius:5px}select option{background:#14161c;color:#e7e9f1}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--n);margin:0}
header{background:var(--card);border-bottom:3px solid var(--o);display:flex;align-items:center;gap:16px;padding:6px 20px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header img{height:50px}header .sp{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,.btn{font:inherit;border:1px solid var(--b);background:var(--card);color:var(--n);padding:7px 13px;border-radius:5px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--n)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--o);outline-offset:1px}
nav button.on{background:var(--n);color:#050607;border-color:var(--n)}
.pri{background:var(--o);border-color:var(--o);color:#fff}.pri:hover{background:#d97716}.dan{color:var(--ko)}
main{max-width:1280px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.card h3{margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.f{display:flex;flex-direction:column;font-weight:600;font-size:12.5px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--b);border-radius:4px;width:100%;background:var(--inp);color:var(--tx)}
textarea{resize:vertical;min-height:60px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--b);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--th);color:var(--n);font-size:12.5px}td.c,th.c{text-align:center;width:54px}
input[type=radio]{appearance:none;-webkit-appearance:none;width:20px;height:20px;padding:0;margin:0;border-radius:50%;border:2px solid var(--c,var(--n));background:transparent;cursor:pointer;vertical-align:middle;flex:none}
input[type=radio][value=OK]{--c:var(--ok)}input[type=radio][value=KO]{--c:var(--ko)}input[type=radio][value=NA],input[type=radio][value=NV]{--c:#fff}input[name=esito]{--c:var(--n)}
input[type=radio]:checked{background:var(--c);box-shadow:inset 0 0 0 3px var(--card)}input:disabled{opacity:1}
.sig{display:inline-block;min-width:280px;min-height:52px;padding:0 10px;border-bottom:1px solid var(--b);font:700 36px/1.3 "Caveat","Segoe Script","Brush Script MT","Lucida Handwriting",cursive;color:var(--n);transform:rotate(-2deg);transform-origin:left bottom}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:2px solid var(--n);border-radius:4px;background:transparent;cursor:pointer;flex:none}input[type=checkbox]:checked{background:var(--n);box-shadow:inset 0 0 0 3px var(--card)}
.op{display:inline-flex;align-items:center;gap:6px;margin:3px 18px 3px 0;color:var(--tx);font-weight:500;font-size:14px}.opts{display:flex;flex-wrap:wrap}
.chg{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px}.ch{width:100%;height:auto}.ch text{fill:var(--mu);font-size:11px}.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mu)}.leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(120px,42%) 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.hbar{background:var(--th);border-radius:3px;height:14px}.hbar div{height:100%;border-radius:3px}.hb b{text-align:right}
.banner{padding:4px 10px;overflow:hidden}.banner svg{display:block;width:100%;height:84px}
.chk td:first-child{white-space:pre-line}.chk td.n{width:44px;text-align:center;color:var(--mu)}
.chk select{min-width:100px}.chk th:last-child,.chk td:last-child{width:46%;min-width:320px}.chk textarea{min-height:56px}.rg{white-space:nowrap;width:190px}.rg label{margin-right:10px;cursor:pointer;font-weight:600}.rg input{margin:0 4px 0 0}.rg label{display:inline-flex;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--b);border-left:5px solid var(--n);border-radius:6px;padding:10px 14px}
.kpi b{display:block;font:700 26px Georgia,serif;color:var(--n)}.kpi.g{border-left-color:var(--ok)}.kpi.r{border-left-color:var(--ko)}.kpi.y{border-left-color:var(--o)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:12.5px}
.G{background:var(--ok)}.Y{background:var(--w)}.R{background:var(--ko)}.N{background:#6f7894}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar .sp{flex:1}
.bar input,.bar select{width:auto;min-width:140px}
.yr{display:grid;grid-template-columns:90px 1fr 1fr 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--b)}
.yr:last-child{border:0}.yr .y{font:700 24px Georgia,serif;color:var(--n)}.yr small{display:block;color:var(--mu)}
#login{max-width:380px;margin:12vh auto;text-align:center}#login img{width:260px;margin-bottom:10px}
#err{background:#3a1613;color:#ffb4ae;border:1px solid #7a2a24;padding:9px 14px;border-radius:5px;margin-bottom:14px;display:none}
#mdlg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.mbox{background:var(--card);border:1px solid var(--b);border-radius:8px;padding:18px 22px;max-width:560px;width:100%}
#sync{position:fixed;left:16px;bottom:16px;background:var(--o);color:#fff;padding:8px 14px;border-radius:5px;font-weight:600;display:none;z-index:9;cursor:pointer}#sync.bad{background:var(--ko)}
#busy{position:fixed;right:16px;bottom:16px;background:var(--o);color:#fff;padding:8px 14px;border-radius:5px;font-weight:600;display:none;z-index:9}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:5px;display:none;z-index:9}
.ph{display:none}.hide{display:none!important}.muted{color:var(--mu)}
@media(max-width:560px){.chg{grid-template-columns:1fr}}
@media(max-width:700px){.yr{grid-template-columns:1fr 1fr}}
@media print{#mdlg,#busy,#sync{display:none!important}:root{color-scheme:light;--bg:#fff;--card:#fff;--b:#999;--tx:#000;--mu:#444;--th:#e5e5e5;--inp:transparent;--n:#26307a}header img,#login img{padding:0}body{background:#fff;font-size:11px}header,.bar,#toast,#err,.noprint{display:none!important}
.ph{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--o);padding-bottom:6px;margin-bottom:10px}.ph img{height:48px}
main{margin:0;max-width:none;padding:0}.card{border:1px solid #999;padding:8px 10px;margin-bottom:8px;overflow:visible!important}.card:not(.big){break-inside:avoid}.card.big{break-inside:auto}h3{break-after:avoid}.kpis{margin-bottom:8px}
tr{break-inside:avoid}input,select,textarea{border:0;padding:0;background:none;appearance:none;-webkit-appearance:none;color:#000;resize:none}
th,td{padding:4px 5px}input[type=radio][value=NA],input[type=radio][value=NV]{--c:#555}input[type=radio][value=NA]:checked,input[type=radio][value=NV]:checked{background:#d6d6d6}.banner{padding:0}.banner svg{height:52px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

let nb=0;function busy(d){nb+=d;$("#busy").style.display=nb>0?"block":"none"}
async function api(action,payload,params,quiet){

      try{j=JSON.parse(tx)}catch(e){throw new Error("risposta non valida [HTTP "+r.status+"] "+tx.slice(0,100))}
      if(j.error)throw new Error(j.error);return j
    }catch(e){last=e.name==="AbortError"?new Error("tempo scaduto"):e;if(/non trovata|già inviato|Nessun indirizzo|Quota|non valido|non valida\b(?!.*HTTP)/.test(last.message)&&!/HTTP/.test(last.message))throw last;await new Promise(r=>setTimeout(r,1200*(n+1)))}

async function go(v,arg){
  $$("nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v||(v==="form"&&b.dataset.v==="new-"+cur?.type)));
  curView=v;$("#phT").innerHTML="";window.scrollTo(0,0);
  if(v==="home"||v==="list"||v==="nclist"||v==="charts"){if(!DB.length){try{DB=JSON.parse(localStorage.vosc||"[]")}catch(e){}}
    const draw=()=>v==="home"?home():v==="list"?list(arg):v==="nclist"?ncList(arg):charts(arg);if(DB.length)draw();else $("#view").innerHTML='<p class="muted">Caricamento dei dati da Google…</p>';
    const ch=await load();if(curView===v&&(ch||!DB.length||v==="charts"))draw()}
  else if(v==="new-cantiere"||v==="new-sub"){openForm(v.slice(4),null,false)}
}
document.addEventListener("click",e=>{const b=e.target.closest("nav button[data-v]");if(b)go(b.dataset.v)});

/* ---------- sintesi per anno ---------- */
function home(){
  const Y=new Date().getFullYear(),ys=new Set([Y,...DB.map(r=>r.year)]),yrs=[...ys].sort((a,b)=>b-a);
  const cur_=DB.filter(r=>r.year===Y&&r.type!=="nc"),nn=DB.filter(r=>r.type==="nc"&&r.year===Y),na=nn.filter(r=>!r.sum?.chiusa).length,c=cur_.filter(r=>r.type==="cantiere"),s=cur_.filter(r=>r.type==="sub");
  const nc=c.reduce((a,r)=>a+(r.sum?.no||0),0),avg=s.length?Math.round(s.reduce((a,r)=>a+(r.sum?.tot||0),0)/s.length):null;
  let h=`<div class="bar"><h2>Sintesi verifiche</h2><span class="sp"></span><button onclick="refresh()">↻ Aggiorna</button><button onclick="sendReminder()">✉ Reminder mail</button><button class="pri" onclick="go('new-cantiere')">+ Verifica cantiere</button><button class="pri" onclick="go('new-sub')">+ Verifica subappalto</button></div>
  <div class="kpis"><div class="kpi"><small>Verifiche ${Y}</small><b>${cur_.length}</b></div><div class="kpi"><small>Cantiere ${Y}</small><b>${c.length}</b></div><div class="kpi"><small>Subappalto ${Y}</small><b>${s.length}</b></div>
  <div class="kpi r"><small>Elementi non conformi (cantieri)</small><b>${nc}</b></div><div class="kpi y" style="cursor:pointer" role="button" tabindex="0" onclick="go('nclist',{year:${Y}})"><small>NC interne ${Y}</small><b>${nn.length}</b><small>${na} aperte · ${nn.length-na} chiuse</small></div><div class="kpi g"><small>Punteggio medio SUB</small><b>${avg??"–"}</b></div></div>
  <div class="card"><h3>Riepilogo per anno di inserimento</h3>`;
  h+=yrs.map(y=>{const a=DB.filter(r=>r.year===y),c=a.filter(r=>r.type==="cantiere"),s=a.filter(r=>r.type==="sub");
    const si=c.reduce((x,r)=>x+(r.sum?.si||0),0),no=c.reduce((x,r)=>x+(r.sum?.no||0),0),m=s.length?Math.round(s.reduce((x,r)=>x+(r.sum?.tot||0),0)/s.length):null;
    const ex=ESITI.map(e=>[e,s.filter(r=>r.sum?.esito===e).length]).filter(x=>x[1]).map(x=>x[1]+" "+x[0].toLowerCase()).join(", ")||"nessun esito";
    return `<div class="yr"><div class="y">${y}</div><div><b>${c.length}</b> verifiche cantiere<small>${si} conformi · ${no} non conformi</small></div>
    <div><b>${s.length}</b> verifiche subappalto<small>${ex}</small></div><div>Punteggio medio SUB<small>${m==null?"–":`<span class="pill ${m>=90?"G":m>=75?"Y":"R"}">${m}/100</span>`}</small></div>
    <span style="white-space:nowrap"><button onclick="go('list',{year:${y}})">Elenco</button> <button onclick="go('nclist',{year:${y}})">NC (${DB.filter(r=>r.type==="nc"&&r.year===y).length})</button></span></div>`}).join("");
  $("#view").innerHTML=`<div class="card banner">${SITE}</div>`+h+"</div>"}

/* ---------- archivio ---------- */
function list(f={}){
  const yrs=[...new Set([new Date().getFullYear(),...DB.map(r=>r.year)])].sort((a,b)=>b-a);
  $("#view").innerHTML=`<div class="bar"><h2>Archivio</h2><span class="sp"></span><button onclick="refresh()">↻ Aggiorna</button><select id="fy"><option value="">Tutti gli anni</option>${yrs.map(y=>`<option ${f.year==y?"selected":""}>${y}</option>`).join("")}</select>
  <select id="ft"><option value="">Tutti i tipi</option><option value="cantiere" ${f.type=="cantiere"?"selected":""}>Cantiere</option><option value="sub" ${f.type=="sub"?"selected":""}>Subappalto</option></select><select id="fa"><option value="">Tutte le aree</option>${AREE.map(a=>`<option>${a}</option>`).join("")}</select><input id="fq" placeholder="Cerca…"></div>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Tipo</th><th>Area</th><th>Cantiere / Impresa</th><th>Verificatore</th><th>Esito</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;
  const draw=()=>{const a=$("#fa").value,y=$("#fy").value,t=$("#ft").value,q=$("#fq").value.toLowerCase();
    const r=DB.filter(r=>r.type!=="nc"&&(!y||r.year==y)&&(!t||r.type==t)&&(!a||areaOf(r)===a)&&(!q||JSON.stringify([r.title,r.who]).toLowerCase().includes(q))).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    $("#rows").innerHTML=r.map(r=>`<tr><td>${fd(r.date)}</td><td>${r.type==="sub"?"Subappalto":"Cantiere"}</td><td>${esc(areaOf(r))}</td><td>${esc(r.title)}</td><td>${esc(r.who)}</td><td>${badge(r)}</td>
    <td style="white-space:nowrap"><button onclick="op('${r.type}','${r.id}',1)">Apri</button> <button onclick="op('${r.type}','${r.id}',0)">Modifica</button> <button onclick="op('${r.type}','${r.id}',1,1)">PDF</button> <button onclick="op('${r.type}','${r.id}',1,1)">Stampa</button> <button class="dan" onclick="del('${r.type}','${r.id}')">Elimina</button></td></tr>`).join("")||`<tr><td colspan=7 class="muted">Nessuna verifica trovata. Inseriscine una dal menu in alto.</td></tr>`};
  ["fy","ft","fa"].forEach(i=>$("#"+i).onchange=draw);$("#fq").oninput=draw;draw()}
function badge(r){const s=r.sum||{};if(r.type==="sub"){const k=s.tot>=90?"G":s.tot>=75?"Y":"R";return `<span class="pill ${k}">${s.tot??0}/100</span> ${esc(s.esito||"")}`}
  return `<span class="pill G">${s.si||0} OK</span> <span class="pill R">${s.no||0} KO</span> <span class="pill N">${s.nv||0} NV</span>`}
async function op(type,id,view,print){try{let r=DB.find(x=>x.id===id&&x.type===type);if(!r||!r.data){const g=(await api("get",null,{type,id})).record;if(r)Object.assign(r,g);else DB.push(g);r=g}openForm(type,r,!!view);if(print)setTimeout(doPrint,400)}catch(e){err("Impossibile aprire la verifica: "+e.message)}}
async function del(type,id){const nl=type==="cantiere"?DB.filter(r=>r.type==="nc"&&r.vid===id).length:0;if(!confirm(nl?`Eliminare definitivamente questa verifica? Le ${nl} NC collegate resteranno nell'elenco NC.`:"Eliminare definitivamente questo elemento?"))return;DB=DB.filter(x=>!(x.id===id&&x.type===type));dbT=Date.now();enqueue("delete",{type,id});toast("Eliminata – invio a Google in corso");go(type==="nc"?"nclist":"list")}

/* ---------- reminder mail: si apre già compilata in Outlook (indirizzi dal foglio "Mail") ---------- */
let MI=null;
async function sendReminder(){
  try{err();MI=await api("mailinfo",null,{});
    if(!MI.n){alert('Nel foglio "Mail" non sono presenti indirizzi.');return}
    let m=$("#mdlg");if(!m){m=document.createElement("div");m.id="mdlg";document.body.appendChild(m)}
    m.innerHTML=`<div class="mbox"><h3>Reminder mail da Outlook</h3><p>Destinatari in <b>CCN</b>: <b>${MI.n}</b><br>In <b>CC</b>: ${MI.cc.map(esc).join(", ")}</p>
    <p class="muted">La mail si apre già compilata (oggetto e testo compresi): in Outlook controlla e premi <b>Invia</b>. Parte dall'account Outlook con cui sei collegato.</p>
    <div class="bar"><button class="pri" onclick="openOutlook('web')">Apri Outlook Web</button><button onclick="openOutlook('app')">Apri app Outlook</button><button onclick="copyBcc()">Copia indirizzi CCN</button><span class="sp"></span><button onclick="$('#mdlg').remove()">Chiudi</button></div><div id="mnote" class="muted"></div></div>`}
  catch(e){err("Lettura indirizzi non riuscita: "+e.message)}}
function openOutlook(k){const q=(o)=>Object.entries(o).map(([a,b])=>a+"="+encodeURIComponent(b)).join("&"),bcc=MI.list.join(";");
  const u=k==="web"?"https://outlook.live.com/mail/0/deeplink/compose?"+q({to:"",cc:MI.cc.join(";"),bcc,subject:MI.subject,body:MI.body})
    :"mailto:?"+q({cc:MI.cc.join(";"),bcc,subject:MI.subject,body:MI.body}).replace(/%0A/g,"%0D%0A");
  if(u.length>7000){$("#mnote").textContent="Gli indirizzi sono troppi per il collegamento diretto: apri Outlook, scrivi un nuovo messaggio e usa «Copia indirizzi CCN».";return}
  window.open(u,k==="web"?"_blank":"_self")}
async function copyBcc(){const s=MI.list.join("; ");try{await navigator.clipboard.writeText(s);$("#mnote").textContent="Indirizzi copiati: incollali nel campo CCN."}catch(e){window.prompt("Copia gli indirizzi CCN:",s)}}

/* ---------- grafici ---------- */
const MESI=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"],C1="#5a6bd8",C2="#ef8a2a";
const areaOf=r=>r.type==="nc"?(r.sum?.area||""):((r.area??r.data?.areaLav)||"");
function grid(w,h,m,T,st){let s="";for(let t=0;t<=T;t+=st){const y=m.t+(h-m.t-m.b)*(1-t/T);s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="var(--b)"/><text x="${m.l-5}" y="${y+4}" text-anchor="end">${t}</text>`}return s}
function bars(labels,ser,w=620,h=230){
  const top=Math.max(1,...ser.flatMap(s=>s.v)),st=Math.max(1,Math.ceil(top/4)),T=Math.ceil(top/st)*st,m={l:30,r:8,t:16,b:28},iw=w-m.l-m.r,ih=h-m.t-m.b,g=iw/labels.length,bw=Math.min(24,g*.8/ser.length);
  let s=`<svg class="ch" viewBox="0 0 ${w} ${h}" role="img">`+grid(w,h,m,T,st);
  labels.forEach((l,i)=>{s+=`<text x="${m.l+g*i+g/2}" y="${h-9}" text-anchor="middle">${l}</text>`;
    ser.forEach((se,j)=>{const v=se.v[i],x=m.l+g*i+(g-bw*ser.length)/2+bw*j,hh=v/T*ih;
      s+=`<rect x="${x}" y="${m.t+ih-hh}" width="${bw-2}" height="${hh}" rx="2" fill="${se.c}"/>`+(v?`<text x="${x+bw/2-1}" y="${m.t+ih-hh-3}" text-anchor="middle" style="fill:var(--tx)">${v}</text>`:"")})});
  return s+"</svg>"+`<div class="leg">${ser.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join("")}</div>`}
function lineC(vals,w=620,h=230){
  const m={l:30,r:8,t:16,b:28},iw=w-m.l-m.r,ih=h-m.t-m.b,g=iw/12,X=i=>m.l+g*i+g/2,Y=v=>m.t+ih*(1-v/100);
  let s=`<svg class="ch" viewBox="0 0 ${w} ${h}" role="img">`+grid(w,h,m,100,25);
  [[75,"var(--w)"],[90,"var(--ok)"]].forEach(([v,c])=>s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="5 4"/>`);
  MESI.forEach((l,i)=>s+=`<text x="${X(i)}" y="${h-9}" text-anchor="middle">${l}</text>`);
  const p=vals.map((v,i)=>v==null?null:[X(i),Y(v),v]).filter(Boolean);
  s+=`<polyline fill="none" stroke="${C2}" stroke-width="2.5" points="${p.map(q=>q[0]+","+q[1]).join(" ")}"/>`+p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${C2}"/><text x="${q[0]}" y="${q[1]-8}" text-anchor="middle" style="fill:var(--tx)">${q[2]}</text>`).join("");
  return s+`</svg><div class="leg"><span><i style="background:${C2}"></i>Punteggio medio</span><span><i style="background:var(--ok)"></i>90 verde</span><span><i style="background:var(--w)"></i>75 giallo</span></div>`}
function hbars(items,c=C2){const mx=Math.max(1,...items.map(x=>x.v));return items.length?items.map(x=>`<div class="hb"><span>${esc(x.l)}</span><div class="hbar"><div style="width:${x.v/mx*100}%;background:${x.c||c}"></div></div><b>${x.v}</b></div>`).join(""):'<span class="muted">Nessun dato disponibile.</span>'}
function charts(f={}){
  const Y=new Date().getFullYear(),yrs=[...new Set([Y,...DB.map(r=>r.year)])].sort((a,b)=>b-a),fy=f.year??Y;
  $("#view").innerHTML=`<div class="bar"><h2>Grafici</h2><span class="sp"></span><button onclick="refresh()">↻ Aggiorna</button><button onclick="window.print()">Stampa / PDF</button><select id="gy"><option value="">Tutti gli anni</option>${yrs.map(y=>`<option ${fy==y?"selected":""}>${y}</option>`).join("")}</select></div><div id="gr"></div>`;
  const draw=()=>{const y=$("#gy").value,A=DB.filter(r=>!y||r.year==y),V=A.filter(r=>r.type==="cantiere"),S=A.filter(r=>r.type==="sub"),N=A.filter(r=>r.type==="nc");
    $("#phT").innerHTML=`<b>Grafici verifiche</b><br>${y||"Tutti gli anni"}`;
    const mon=a=>MESI.map((_,i)=>a.filter(r=>+(r.date||"").slice(5,7)-1===i).length),ar=(a,k=areaOf)=>AR.map(x=>a.filter(r=>(k(r)||"Non indicata")===x).length);
    const si=V.reduce((a,r)=>a+(r.sum?.si||0),0),no=V.reduce((a,r)=>a+(r.sum?.no||0),0),avg=S.length?Math.round(S.reduce((a,r)=>a+(r.sum?.tot||0),0)/S.length):null,na=N.filter(r=>!r.sum?.chiusa).length;
    const sm=MESI.map((_,i)=>{const a=S.filter(r=>+(r.date||"").slice(5,7)-1===i);return a.length?Math.round(a.reduce((x,r)=>x+(r.sum?.tot||0),0)/a.length):null});
    const ko=CHK.map((x,i)=>({l:`${i+1}. ${x.split("\n")[0].slice(0,58)}`,v:V.filter(r=>["KO","NO"].includes(r.data?.["c"+i])).length})).filter(x=>x.v).sort((a,b)=>b.v-a.v).slice(0,8);
    const card=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;
    $("#gr").innerHTML=`<div class="kpis"><div class="kpi"><small>Verifiche interne</small><b>${V.length}</b></div><div class="kpi"><small>Verifiche subappalto</small><b>${S.length}</b></div>
    <div class="kpi g"><small>Conformità media interne</small><b>${si+no?Math.round(si/(si+no)*100)+"%":"–"}</b></div><div class="kpi g"><small>Punteggio medio SUB</small><b>${avg??"–"}</b></div><div class="kpi r"><small>NC aperte / totali</small><b>${na}/${N.length}</b></div></div>
    <div class="chg">${card("Verifiche per mese",bars(MESI,[{n:"Interne",c:C1,v:mon(V)},{n:"Subappalto",c:C2,v:mon(S)}]))}
    ${card("Verifiche per area di lavoro",bars(AR,[{n:"Interne",c:C1,v:ar(V)},{n:"Subappalto",c:C2,v:ar(S)}]))}
    ${card("Punteggio medio subappalto per mese",lineC(sm))}
    ${card("Esiti verifiche subappalto",hbars(ESITI.map(e=>({l:e,v:S.filter(r=>r.sum?.esito===e).length,c:e==="Conforme"?"var(--ok)":e==="Conforme con prescrizioni"?"var(--w)":"var(--ko)"}))))}
    ${card("NC interne per area",bars(AR,[{n:"Aperte",c:"#f0524a",v:ar(N.filter(r=>!r.sum?.chiusa))},{n:"Chiuse",c:"#22b866",v:ar(N.filter(r=>r.sum?.chiusa))}]))}
    ${card("Voci checklist più frequentemente KO",hbars(ko,"var(--ko)"))}</div>`};
  $("#gy").onchange=draw;draw()}

const AREE=["Marano","Battipaglia","Frosinone","Matera","Sala Consilina"],YN=["Sì","No"],
CAUSE=["Procedura/istruzione","Documentazione","Formazione/informazione","Organizzazione","Controllo/sorveglianza","DPI/attrezzatura","Comunicazione","Subappaltatore","Modifica condizioni operative","Altro"],
EVID=["Documento","Foto","Registrazione","Comunicazione","Formazione","Verifica on site","Altro"],MODAL=["On site","Documentale","Osservazione","Intervista","Checklist successiva"],EFF=["Efficace","Parzialmente efficace","Non efficace"];

const RB=(k,l,o)=>`<div class="f"><b>${l}</b><div class="opts">${o.map(x=>`<label class="op"><input type="radio" name="${k}" value="${x}"> ${x}</label>`).join("")}</div></div>`;
const CB=(p,l,o)=>`<div class="f"><b>${l}</b><div class="opts">${o.map((x,i)=>`<label class="op"><input type="checkbox" name="${p}${i}"> ${x}</label>`).join("")}</div></div>`;
const TA=(k,l)=>`<label class="f">${l}<textarea name="${k}" rows="2"></textarea></label>`;
function ncHTML(){return `<div class="card"><h3>Dati scheda</h3><div class="grid">${F("codice","Codice scheda")}${F("data","Data apertura","date")}${F("cantiere","Cantiere")}${F("dataVerifica","Data verifica on site","date")}${F("assistente","Assistente/Verificatore")}${F("respArea","Responsabile Area")}${F("punto","N. punto checklist")}</div><br>${RB("area","Area",AREE)}</div>
<div class="card"><h3>1. Descrizione della NC</h3>${TA("descr","Descrizione chiara, oggettiva e verificabile")}<br>${TA("evidenza","Evidenza oggettiva")}<br>${RB("docAll","Documentazione/fotografia allegata",YN)}</div>
<div class="card"><h3>2. Valutazione iniziale</h3><div class="grid">${RB("intImm","Intervento immediato",YN)}${RB("rischio","Rischio immediato",YN)}${RB("ncNota","NC già rilevata",["Sì","No","Non noto"])}${RB("estens","Estensione ad altri cantieri",YN)}</div></div>

<div class="card"><h3>4. Azione di miglioramento</h3>${TA("azione","Azione prevista")}<br>${TA("obiettivo","Obiettivo")}<br><div class="grid">${F("azResp","Responsabile")}${F("azScad","Scadenza","date")}</div></div>
<div class="card"><h3>5. Attuazione</h3><div class="grid">${F("attData","Data attuazione","date")}${F("evRif","Riferimento evidenza")}</div><br>${TA("attDescr","Descrizione")}<br>${CB("ev","Evidenza",EVID)}</div>
<div class="card"><h3>6. Verifica efficacia</h3><div class="grid">${F("efData","Data","date")}${F("efVer","Verificatore")}</div><br>${CB("md","Modalità",MODAL)}<br>${RB("efEsito","Esito",EFF)}<br>${TA("efEvid","Evidenze")}</div>
<div class="card"><h3>7. Chiusura</h3>${RB("chiusa","NC chiusa",YN)}<br><div class="grid">${F("dataChiusura","Data chiusura","date")}${F("firmaRA","Firma Responsabile Area")}${F("valRSGI","Validazione RSGI")}</div><br>${TA("ulteriori","Ulteriori azioni")}</div>
<div class="card"><h3>8. Trasmissione mensile</h3><div class="grid">${F("trasData","Data","date")}</div><br><div class="opts"><label class="op"><input type="checkbox" name="inviata"> Inviata a sicurezza@impresadelta.com</label><label class="op"><input type="checkbox" name="trasmesse"> Trasmesse al RSGI</label></div></div>`}
function nextCode(){const y=new Date().getFullYear(),m=Math.max(0,...DB.filter(r=>r.type==="nc"&&r.year===y).map(r=>+((String(r.title).match(/SM-(\d+)/)||[])[1]||0)));return `SM-${String(m+1).padStart(3,"0")}/${y}`}
function fillNcl(){const el=$("#ncl");if(!el)return;const l=DB.filter(r=>r.type==="nc"&&r.vid&&r.vid===cur.id);
  el.innerHTML=l.length?l.map(r=>`<div class="bar" style="margin:0 0 6px"><b>${esc(r.title)}</b><span class="pill ${r.sum?.chiusa?"G":"R"}">${r.sum?.chiusa?"Chiusa":"Aperta"}</span><span class="sp"></span><button onclick="op('nc','${r.id}',1)">Apri</button></div>`).join(""):'<span class="muted">Nessuna NC generata per questa verifica.</span>'}
async function genNC(){
  if(!cur.id){if(!confirm("Per generare la NC la verifica deve essere salvata. Salvare ora?"))return;if(!await save(true))return}
  const d=cur.data,done=new Set(DB.filter(r=>r.type==="nc"&&r.vid===cur.id).flatMap(r=>String(r.sum?.punto||"").split(/[^0-9]+/))),
    ko=CHK.map((_,i)=>d["c"+i]==="KO"?i:-1).filter(i=>i>=0),todo=ko.filter(i=>!done.has(String(i+1)));
  if(!ko.length&&!confirm("Nella verifica non ci sono voci KO. Generare comunque una NC vuota?"))return;
  openForm("nc",null,false,{vid:cur.id,cantiere:d.cantiere||"",dataVerifica:d.data||"",area:d.areaLav||"",assistente:d.compilatore||"",punto:todo.map(i=>i+1).join(", "),
    descr:todo.map(i=>`${i+1}. ${CHK[i].split("\n")[0]}${d["n"+i]?" – "+d["n"+i]:""}`).join("\n"),data:today(),codice:nextCode()})}
function ncList(f={}){
  const Y=new Date().getFullYear(),N=DB.filter(r=>r.type==="nc"),yrs=[...new Set([Y,...N.map(r=>r.year)])].sort((a,b)=>b-a),fy=f.year??Y;
  $("#view").innerHTML=`<div class="bar"><h2>NC interne</h2><span class="sp"></span><button onclick="refresh()">↻ Aggiorna</button><select id="ny"><option value="">Tutti gli anni</option>${yrs.map(y=>`<option ${fy==y?"selected":""}>${y}</option>`).join("")}</select>
  <select id="ns"><option value="">Tutti gli stati</option><option>Aperta</option><option>Chiusa</option></select><input id="nq" placeholder="Cerca…"></div>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Codice</th><th>Data apertura</th><th>Cantiere</th><th>Area</th><th>Verifica</th><th>Stato</th><th></th></tr></thead><tbody id="nrows"></tbody></table></div>`;
  const draw=()=>{const y=$("#ny").value,s=$("#ns").value,q=$("#nq").value.toLowerCase();
    const r=N.filter(r=>(!y||r.year==y)&&(!s||(r.sum?.chiusa?"Chiusa":"Aperta")===s)&&(!q||JSON.stringify([r.title,r.who,r.sum?.area]).toLowerCase().includes(q))).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    $("#nrows").innerHTML=r.map(r=>`<tr><td><b>${esc((r.title||"").split(" – ")[0])}</b></td><td>${fd(r.date)}</td><td>${esc((r.title||"").split(" – ").slice(1).join(" – "))}</td><td>${esc(r.sum?.area||"")}</td>
    <td>${r.vid?`<button onclick="op('cantiere','${r.vid}',1)">Apri verifica</button>`:"–"}</td><td><span class="pill ${r.sum?.chiusa?"G":"R"}">${r.sum?.chiusa?"Chiusa":"Aperta"}</span></td>
    <td style="white-space:nowrap"><button onclick="op('nc','${r.id}',1)">Apri</button> <button onclick="op('nc','${r.id}',0)">Modifica</button> <button onclick="op('nc','${r.id}',1,1)">PDF</button> <button onclick="op('nc','${r.id}',1,1)">Stampa</button> <button onclick="dlWord(DB.find(x=>x.id==='${r.id}').data)">Word</button> <button class="dan" onclick="del('nc','${r.id}')">Elimina</button></td></tr>`).join("")||`<tr><td colspan=7 class="muted">Nessuna NC trovata. Generala da una verifica cantiere con il pulsante «Genera NC».</td></tr>`};
  ["ny","ns"].forEach(i=>$("#"+i).onchange=draw);$("#nq").oninput=draw;draw()}
function wordNC(d){
  const cb=o=>o?"☒":"☐",ch=(a,v)=>a.map(x=>cb(v===x)+" "+x).join(" &nbsp; "),cl=(p,a)=>a.map((x,i)=>cb(d[p+i])+" "+x+(p==="cz"&&x==="Altro"&&d.causaAltro?": "+esc(d.causaAltro):"")).join(" &nbsp; "),
  e=x=>esc(x||"______________").replace(/\n/g,"<br>"),dt=x=>x?fd(x):"___/___/______",
  row=(a,b)=>`<tr><td style="width:32%;border:1px solid #444;padding:4px"><b>${a}</b></td><td style="border:1px solid #444;padding:4px">${b}</td></tr>`,
  p=x=>`<p style="margin:3pt 0">${x}</p>`,h=x=>`<p style="margin:12pt 0 3pt;font-size:12pt"><b>${x}</b></p>`;
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Scheda NC</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}</style></head><body>
<p style="text-align:center;font-size:15pt"><b>SCHEDA DI MIGLIORAMENTO / NON CONFORMITÀ (SM-01)</b></p>
<table style="border-collapse:collapse;width:100%"><tr><td style="border:1px solid #444;padding:4px;background:#e5e5e5"><b>Campo</b></td><td style="border:1px solid #444;padding:4px;background:#e5e5e5"><b>Compilazione</b></td></tr>
${row("Codice scheda",e(d.codice))}${row("Data apertura",dt(d.data))}${row("Area",ch(AREE,d.area))}${row("Cantiere",e(d.cantiere))}${row("Data verifica on site",dt(d.dataVerifica))}${row("Assistente/Verificatore",e(d.assistente))}${row("Responsabile Area",e(d.respArea))}${row("N. punto checklist",e(d.punto))}</table>
${h("1. Descrizione della NC")}${p("Descrizione chiara, oggettiva e verificabile: "+e(d.descr))}${p("Evidenza oggettiva: "+e(d.evidenza))}${p("Documentazione/fotografia allegata: "+ch(YN,d.docAll))}
${h("2. Valutazione iniziale")}${p("Intervento immediato: "+ch(YN,d.intImm))}${p("Rischio immediato: "+ch(YN,d.rischio))}${p("NC già rilevata: "+ch(["Sì","No","Non noto"],d.ncNota))}${p("Estensione ad altri cantieri: "+ch(YN,d.estens))}
${h("3. Analisi della causa")}${p(cl("cz",CAUSE))}${p("Descrizione causa: "+e(d.causaDescr))}
${h("4. Azione di miglioramento")}${p("Azione prevista: "+e(d.azione))}${p("Obiettivo: "+e(d.obiettivo))}${p("Responsabile: "+e(d.azResp))}${p("Scadenza: "+dt(d.azScad))}
${h("5. Attuazione")}${p("Data attuazione: "+dt(d.attData))}${p("Descrizione: "+e(d.attDescr))}${p("Evidenza: "+cl("ev",EVID))}${p("Riferimento evidenza: "+e(d.evRif))}
${h("6. Verifica efficacia")}${p("Data: "+dt(d.efData))}${p("Verificatore: "+e(d.efVer))}${p("Modalità: "+cl("md",MODAL))}${p("Esito: "+ch(EFF,d.efEsito))}${p("Evidenze: "+e(d.efEvid))}
${h("7. Chiusura")}${p("NC chiusa: "+ch(YN,d.chiusa))}${p("Data chiusura: "+dt(d.dataChiusura))}${p("Ulteriori azioni: "+e(d.ulteriori))}${p("Firma Responsabile Area: "+e(d.firmaRA))}${p("Validazione RSGI: "+e(d.valRSGI))}
${h("8. Trasmissione mensile")}${p("Data: "+dt(d.trasData))}${p(cb(d.inviata)+" Inviata a sicurezza@impresadelta.com")}${p(cb(d.trasmesse)+" Trasmesse al RSGI")}</body></html>`}
function dlWord(d){const b=new Blob(["\ufeff"+wordNC(d)],{type:"application/msword"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="NC_"+(d.codice||"scheda").replace(/\W+/g,"_")+".doc";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}

const COMM=["FIBERCOP","OPENFIBER","ENEL","Poste","ANAS","Altro"];
const S=(k,l,o)=>`<label class="f">${l}<select name="${k}"><option></option>${o.map(x=>`<option>${x}</option>`).join("")}</select></label>`;
const F=(k,l,t="text")=>`<label class="f">${l}<input type="${t}" name="${k}"></label>`;
function openForm(type,rec,readonly,pre){
  curView="form";ro=readonly;cur={type,id:rec?.id||null,data:rec?.data?JSON.parse(JSON.stringify(rec.data)):{data:today(),...(pre||{})}};if(!cur.data.data)cur.data.data=today();if(!rec){if(type==="sub")SUBS.forEach(([k,,,it])=>it.forEach((_,i)=>cur.data[k+i]="OK"));else if(type==="cantiere")CHK.forEach((_,i)=>cur.data["c"+i]="OK")}CHK.forEach((_,i)=>{const k="c"+i,v=cur.data[k];if(v==="SI")cur.data[k]="OK";else if(v==="NO")cur.data[k]="KO"});
  const isS=type==="sub",TT={sub:"Verifica cantiere subappalto",nc:"Scheda di miglioramento / Non conformità (SM-01)",cantiere:"Check list cantiere esterno"}[type];let h=`<div class="bar noprint"><h2>${TT}</h2><span class="sp"></span>
  ${ro?`<button onclick="openForm('${type}',cur.rec,false)">Modifica</button>`:`<button class="pri" onclick="save()">Salva</button>`}
  ${type==="cantiere"?'<button class="pri" onclick="genNC()">Genera NC</button>':""}${type==="nc"?'<button onclick="dlWord(cur.data)">Esporta Word</button>':""}${type==="nc"&&cur.data.vid?`<button onclick="op('cantiere','${cur.data.vid}',1)">Verifica collegata</button>`:""}<button onclick="doPrint()">Esporta PDF</button><button onclick="doPrint()">Stampa</button><button onclick="go('${type==="nc"?"nclist":"list"}')">Chiudi</button></div>`;
  cur.rec={id:cur.id,data:cur.data};h+=`<div class="card banner">${SITE}</div>`;
  if(isS){h+=`<div class="card"><h3>1. Dati generali</h3><div class="grid">${S("areaLav","Area di lavoro",AREE)}${S("committente","Committenza",COMM)}${F("committente_altro","Altro (specificare)")}${F("impresa","Impresa subappaltatrice")}${F("oda","ODA / NTW / WR")}${F("cantiere","Cantiere")}${F("data","Data","date")}${F("verificatore","Verificatore")}${F("caposquadra","Caposquadra presente")}</div></div>`;
    SUBS.forEach(([k,t,w,it])=>h+=`<div class="card"><h3>${t}<span id="sc_${k}" class="muted"></span></h3><table><tr><th>Controllo</th><th class="c">OK</th><th class="c">KO</th><th class="c">NA</th><th>Note</th></tr>
    ${it.map((x,i)=>`<tr><td>${x}</td>${["OK","KO","NA"].map(v=>`<td class="c"><input type="radio" name="${k}${i}" value="${v}" aria-label="${v}"></td>`).join("")}<td><input name="n_${k}${i}"></td></tr>`).join("")}</table></div>`);
    h+=`<div class="card"><h3>6. Eventuali non conformità / osservazioni</h3><div class="grid"><label class="f">Gravità<select name="grav"><option></option><option>Minore</option><option>Critica</option></select></label></div><br><label class="f">Descrizione<textarea name="desc"></textarea></label></div>
    <div class="card"><h3>7. Punteggio verifica <span id="val"></span></h3><table>${SUBS.map(s=>`<tr><td>${s[1].slice(3)}</td><td id="p_${s[0]}"></td></tr>`).join("")}<tr><th>Totale</th><th id="p_tot"></th></tr></table>
    <p class="muted">Punteggio sezione = peso × (N. OK / N. item verificati, esclusi NA). Valutazione: 90-100 verde · 75-89 giallo · &lt;75 rosso.</p></div>
    <div class="card"><h3>8. Esito finale</h3>${ESITI.map(e=>`<label style="display:flex;align-items:center;gap:8px;margin:6px 0"><input type="radio" name="esito" value="${e}"> ${e}</label>`).join("")}<br><label class="f">Note<textarea name="note"></textarea></label><br><div class="sig" id="sig"></div><br><small class="muted">Firma del verificatore</small></div>`}
  else if(type==="nc"){h+=ncHTML()}
  else{h+=`<div class="card"><h3>Intestazione</h3><div class="grid">${S("areaLav","Area di lavoro",AREE)}${F("cantiere","Cantiere")}${S("committente","Committenza",COMM)}${F("committente_altro","Altro (specificare)")}${F("sito","Sito")}${F("intervento","Intervento")}${F("compilatore","Compilatore")}${F("data","Data compilazione","date")}</div></div>
    <div class="kpis"><div class="kpi g"><small>Elementi conformi</small><b id="k_si">0</b></div><div class="kpi r"><small>Elementi non conformi</small><b id="k_no">0</b></div><div class="kpi"><small>Non valutati</small><b id="k_nv">0</b></div></div>
    <div class="card big" style="overflow-x:auto"><h3>Verifiche</h3><table class="chk"><tr><th>N.</th><th>Voce di controllo</th><th>Verifica</th><th>Conformità</th><th>Note</th></tr>
    ${CHK.map((x,i)=>`<tr><td class="n">${i+1}</td><td>${esc(x)}</td><td><select name="v${i}"><option></option><option>Sito</option><option>Documentale</option></select></td><td class="rg">${["OK","KO","NV"].map(v=>`<label><input type="radio" name="c${i}" value="${v}"> ${v}</label>`).join("")}</td><td><textarea name="n${i}" rows="2" style="min-height:56px"></textarea></td></tr>`).join("")}</table></div>
    <div class="card"><h3>Conclusioni <button class="noprint" onclick="gen()">Genera dalle risultanze</button></h3><textarea name="concl" rows="8"></textarea></div><div class="card noprint"><h3>NC collegate</h3><div id="ncl"></div></div><div class="card"><h3>Firma</h3><div class="sig" id="sig"></div><br><small class="muted">Firma del compilatore</small></div>`}
  $("#view").innerHTML=h;$("#phT").innerHTML=`<b>${TT}</b><br>${fd(cur.data.data)}`;
  $$("[name]").forEach(el=>{const v=cur.data[el.name];if(el.type==="radio")el.checked=v===el.value;else if(el.type==="checkbox")el.checked=!!v;else{if(el.tagName==="SELECT"&&v&&![...el.options].some(o=>o.value===v))el.add(new Option(v));el.value=v??""}if(ro)el.disabled=true});
  calc();grow();fillNcl();$("#view").oninput=e=>{const n=e.target.name;if(n&&e.target.type!=="radio"){cur.data[n]=e.target.type==="checkbox"?e.target.checked:e.target.value;calc();grow()}};
  $("#view").onclick=e=>{const el=e.target;if(el.type==="radio"&&!ro){if(cur.data[el.name]===el.value){el.checked=false;delete cur.data[el.name]}else cur.data[el.name]=el.value;calc()}}}
function grow(){$$("textarea").forEach(t=>{t.style.height="auto";t.style.height=Math.max(t.scrollHeight,34)+"px"})}
const tc=s=>String(s||"").trim().toLowerCase().replace(/(^|[\s'’-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function calc(){const d=cur.data;d.firma=tc(cur.type==="sub"?d.verificatore:d.compilatore);const sg=$("#sig");if(sg)sg.textContent=d.firma;const oa=$("[name=committente_altro]");if(oa)oa.closest("label").style.display=d.committente==="Altro"?"":"none";
  if(cur.type==="nc"){d._s={chiusa:d.chiusa==="Sì",area:d.area||"",punto:d.punto||""}}
  else if(cur.type==="cantiere"){let si=0,no=0;CHK.forEach((_,i)=>{if(d["c"+i]==="OK")si++;else if(d["c"+i]==="KO")no++});
    d._s={si,no,nv:CHK.length-si-no};["si","no","nv"].forEach(k=>$("#k_"+k).textContent=d._s[k])}
  else{let tot=0;SUBS.forEach(([k,,w,it])=>{let ok=0,ko=0;it.forEach((_,i)=>{const v=d[k+i];if(v==="OK")ok++;else if(v==="KO")ko++});
      const p=ok+ko?Math.round(w*ok/(ok+ko)*10)/10:0;tot+=p;$("#sc_"+k).textContent=ok+ko?`Punteggio ${p}/${w}`:`Punteggio –/${w}`;$("#p_"+k).textContent=`${p} / ${w}`});
    tot=Math.round(tot*10)/10;$("#p_tot").textContent=tot+" / 100";const c=tot>=90?"G":tot>=75?"Y":"R";
    $("#val").innerHTML=`<span class="pill ${c}">${c==="G"?"Verde":c==="Y"?"Giallo":"Rosso"}</span>`;d._s={tot,esito:d.esito||""}}}
function gen(){if(ro)return;const d=cur.data,l=(v)=>CHK.map((x,i)=>d["c"+i]===v?`${i+1}. ${x.split("\n")[0]}`:null).filter(Boolean).join("\n");
  cur.data.concl=`Le evidenze raccolte nel corso della verifica sono le seguenti:\n\nELEMENTI NON CONFORMI:\n${l("KO")||"nessuno"}\n\nELEMENTI CONFORMI:\n${l("OK")||"nessuno"}\n\nIn allegato la check list con le risultanze di dettaglio.`;
  $("[name=concl]").value=cur.data.concl;grow()}
async function save(stay){const d=cur.data;calc();if(!d.data){toast("Inserisci la data");return false}
  const k=cur.type,s=k==="sub",n=k==="nc";if(n&&!d.codice){toast("Inserisci il codice scheda");return false}
  const rec={id:cur.id||Date.now().toString(36),type:k,year:+d.data.slice(0,4),date:d.data,
    title:n?`${d.codice} – ${d.cantiere||"—"}`:s?`${d.impresa||"—"} – ${d.cantiere||"—"}`:(d.cantiere||"—")+(d.intervento?" – "+d.intervento:""),
    who:n?d.assistente||"":s?d.verificatore||"":d.compilatore||"",sum:d._s,vid:d.vid||"",area:n?d.area||"":d.areaLav||"",updated:Date.now(),data:d};
  cur.id=rec.id;DB=DB.filter(x=>!(x.id===rec.id&&x.type===rec.type));DB.push(rec);dbT=Date.now();enqueue("save",{type:k,record:rec});
  toast((n?"NC salvata":"Verifica salvata")+" – invio a Google in corso");if(stay)return true;go(n?"nclist":"list");return true}
function doPrint(){const d=cur.data,old=document.title;document.title=({sub:"Verifica_SUB_",nc:"NC_"}[cur.type]||"Verifica_Cantiere_")+(d.cantiere||"").replace(/\W+/g,"_")+"_"+(d.data||"");
  grow();window.print();document.title=old}
/* avvio automatico se già autenticato (in fondo, dopo tutte le dichiarazioni) */
try{if(sessionStorage.ok)start()}catch(e){}
</script></body></html>
